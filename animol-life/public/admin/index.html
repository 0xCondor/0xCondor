<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Pannello Animol Life</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<header class="top">
  <strong class="brand">Animol Life · Pannello</strong>
  <span id="who" class="muted"></span>
  <button type="button" id="logout" class="btn ghost" hidden>Esci</button>
</header>

<section id="login-view" class="card narrow" hidden>
  <h1>Accesso amministratore</h1>
  <form id="login-form" novalidate>
    <label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" required maxlength="254">
    <label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password" required maxlength="128">
    <p class="err" id="login-err" role="alert" hidden></p>
    <button type="submit" class="btn primary" id="login-submit">Accedi</button>
  </form>
  <p class="muted small">Area riservata. Gli accessi e le modifiche sono registrati.</p>
</section>

<div id="app" hidden>
  <nav class="tabs" role="tablist" aria-label="Sezioni">
    <button type="button" role="tab" data-tab="dashboard" aria-selected="true">Dashboard</button>
    <button type="button" role="tab" data-tab="orders">Ordini</button>
    <button type="button" role="tab" data-tab="products">Prodotti</button>
    <button type="button" role="tab" data-tab="coupons">Coupon</button>
    <button type="button" role="tab" data-tab="plus">Membri Plus</button>
    <button type="button" role="tab" data-tab="newsletter">Newsletter</button>
    <button type="button" role="tab" data-tab="leads">Contatti B2B</button>
    <button type="button" role="tab" data-tab="audit">Registro</button>
  </nav>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
