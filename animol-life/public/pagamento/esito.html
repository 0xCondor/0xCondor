<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Esito del pagamento · Animol Life</title>
<style>
:root{--bg:#fffaf5;--surface:#fff;--text:#1f2937;--muted:#6b7280;--brand:#0f6b57;--border:#e5e7eb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1513;--surface:#18201d;--text:#e5ece9;--muted:#9aa8a2;--brand:#3fb894;--border:#2a3531;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding:16px}
main{max-width:520px;margin:8vh auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px}
h1{font-size:1.4rem;margin:0 0 8px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.muted{color:var(--muted);font-size:.9rem}
.order{font-family:ui-monospace,monospace;font-weight:700;font-size:1.1rem;letter-spacing:.04em}
a.btn{display:block;text-align:center;min-height:48px;line-height:48px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;text-decoration:none;margin-top:16px}
</style>
</head>
<body>
<main>
  <h1 id="title">Verifica del pagamento…</h1>
  <p>Ordine <span class="order" id="order-id"></span></p>
  <p id="msg" aria-live="polite"></p>
  <a class="btn" href="/">Torna al negozio</a>
  <p class="muted">Se hai un account trovi l'ordine in "I miei ordini". Per assistenza rispondi all'email di conferma dell'ordine.</p>
</main>
<script>
(function(){
  'use strict';
  var q = new URLSearchParams(location.search);
  var orderId = q.get('order') || '', esito = q.get('esito') || '';
  var $ = function(id){ return document.getElementById(id); };
  function show(cls, title, msg){ $('title').className = cls; $('title').textContent = title; $('msg').textContent = msg; }
  if (!/^AL-\d{4}-[A-Z0-9]{6}$/.test(orderId)){ show('bad', 'Link non valido', 'Il numero d\'ordine non è valido.'); return; }
  $('order-id').textContent = orderId;
  if (esito === 'annullato'){ show('warn', 'Pagamento annullato', 'Nessun addebito. L\'ordine resta in attesa di pagamento: puoi completarlo da "I miei ordini" se hai un account, oppure fare un nuovo ordine.'); return; }
  if (esito === 'errore'){ show('bad', 'Pagamento non riuscito', 'Il pagamento non è stato completato o non è stato possibile verificarlo. Nessun addebito è stato confermato: riprova o contatta l\'assistenza.'); return; }
  // Lo stato arriva dal server (webhook Stripe o cattura PayPal): il ritorno dal provider da solo non basta.
  var tries = 0;
  function poll(){
    tries++;
    fetch('/api/order-status', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json', Accept:'application/json'}, body:JSON.stringify({orderId:orderId})})
      .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function(d){
        if (d.paymentStatus === 'paid'){ show('ok', 'Pagamento ricevuto', 'Grazie! Il pagamento è confermato e stiamo preparando il tuo ordine. Ti avviseremo via email alla spedizione.'); return; }
        if (tries < 10){ show('', 'Verifica del pagamento…', 'Stiamo aspettando la conferma dal circuito di pagamento.'); setTimeout(poll, 2000); return; }
        show('warn', 'Pagamento in verifica', 'La conferma non è ancora arrivata. Riceverai un\'email appena il pagamento sarà registrato.');
      })
      .catch(function(){ show('warn', 'Pagamento in verifica', 'Non riusciamo a verificare lo stato ora. Riceverai un\'email appena il pagamento sarà registrato.'); });
  }
  poll();
})();
</script>
</body>
</html>
